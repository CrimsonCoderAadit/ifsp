<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Finder</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="risk" class="risk" role="alert" hidden></div><main>
<header><h1>Bus Finder</h1><span id="connection" class="dot" aria-label="Connecting"></span></header>
<section aria-labelledby="source-title"><h2 id="source-title">Source</h2><div class="actions">
<label class="button">Upload bus photo<input id="upload" class="sr-only" type="file" accept="image/*,video/*"></label>
<button id="cameraButton" type="button">Use camera</button></div>
<div class="preview"><img id="photo" alt="Selected bus photo" hidden><video id="video" autoplay muted playsinline hidden></video><canvas id="boxes" aria-hidden="true"></canvas></div></section>
<section class="card" aria-labelledby="result-title"><h2 id="result-title">Result</h2>
<div class="row"><span>BUS DETECTED</span><strong id="detected">…</strong></div>
<div class="row"><span>OCR</span><strong id="ocr">…</strong></div>
<div class="row"><span>NORMALIZED</span><strong id="normalized">…</strong></div>
<div class="row"><span>ROUTE</span><strong id="route">…</strong></div>
<p id="message" role="status" aria-live="polite">Choose a bus photo or video.</p></section>
<section id="stops" class="card" aria-labelledby="stops-title" hidden><h2 id="stops-title">Stops</h2>
<p id="stopsNote"></p><div id="directions"></div></section>
<section class="talk"><button id="talk" type="button" aria-keyshortcuts="Space">Hold and say “bus”</button>
<meter id="level" min="0" max="1" value="0" aria-label="Microphone level"></meter>
<p id="caption" aria-live="polite">Spoken route will appear here.</p>
<button id="again" type="button" disabled>Speak again</button></section>
</main><script src="/static/main.js" defer></script></body></html>
